name: build-driver

on:
  workflow_dispatch:
    inputs:
      unraid_version:
        description: "Unraid version to build for, e.g. 7.3.2. Leave blank for latest stable."
        required: false
        default: ""
      force:
        description: "Rebuild even if release already exists"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write

concurrency:
  group: hideck-qmi-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Unraid version and download URL
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ github.event.inputs.unraid_version }}
        run: |
          set -euo pipefail
          JSON="$(curl -fsSL --retry 3 --connect-timeout 15 "https://releases.unraid.net/json?includePublic=1")"
          if [ -n "${REQUESTED:-}" ]; then
            VERSION="$REQUESTED"
          else
            VERSION="$(python3 -c "import sys, json; data=json.loads(sys.stdin.read()); stable=[x['version'] for x in data if '-' not in x.get('version', '') and x.get('published')]; print(stable[0])" <<< "$JSON")"
          fi
          test -n "$VERSION"
          DL_URL="$(python3 -c "import sys, json; data=json.loads(sys.stdin.read()); m={x['version']: x.get('url') for x in data}; print(m.get('$VERSION', ''))" <<< "$JSON")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dl_url=$DL_URL" >> "$GITHUB_OUTPUT"
          echo "Target Unraid: $VERSION"
          echo "Download URL: $DL_URL"

      - name: Skip existing release
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          TAG="unraid-${VERSION}"
          if [ "${FORCE:-false}" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build qmi_wwan and cdc_wdm
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          DL_URL: ${{ steps.resolve.outputs.dl_url }}
        run: |
          set -euo pipefail
          mkdir -p out cache /tmp/unraid-extracted

          # 1. Download official Unraid release
          ARCHIVE="unRAIDServer-${VERSION}-x86_64.zip"
          echo "Downloading ${ARCHIVE}..."
          curl -fSL --retry 3 --connect-timeout 20 "${DL_URL}" -o "cache/${ARCHIVE}"
          unzip -q -o "cache/${ARCHIVE}" -d /tmp/unraid-extracted

          # 2. Extract bzroot (Unraid 7 uses zstd decompression)
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd cpio rsync kmod
          mkdir -p /tmp/stock_root
          cd /tmp/stock_root
          BZROOT="/tmp/unraid-extracted/bzroot"
          SKIP_BLOCKS=$(cpio -ivt -H newc < "$BZROOT" 2>&1 >/dev/null | awk '{print $1}')
          dd if="$BZROOT" bs=512 skip="$SKIP_BLOCKS" 2>/dev/null | (zstdcat 2>/dev/null || xzcat) | cpio -i -d -H newc --no-absolute-filenames

          # 3. Determine Kernel Version
          KERNEL_DIR="$(ls -d /tmp/stock_root/usr/src/linux-* 2>/dev/null | head -n1)"
          test -n "$KERNEL_DIR"
          KERNEL_VERSION_STR="$(basename "$KERNEL_DIR" | sed 's/^linux-//')"
          KERNEL_VERSION="$(echo "$KERNEL_VERSION_STR" | cut -d'-' -f1)"
          echo "Found kernel source for: $KERNEL_VERSION_STR ($KERNEL_VERSION)"

          # 4. Fetch pristine kernel tarball and apply patches
          MAJOR_VER="$(echo "$KERNEL_VERSION" | cut -d'.' -f1)"
          TARBALL="linux-${KERNEL_VERSION}.tar.xz"
          mkdir -p /tmp/kbuild
          echo "Fetching kernel source: ${TARBALL}..."
          curl -fSL --retry 3 "https://mirrors.edge.kernel.org/pub/linux/kernel/v${MAJOR_VER}.x/${TARBALL}" -o "cache/${TARBALL}"
          tar -C /tmp/kbuild --strip-components=1 -xf "cache/${TARBALL}"
          rsync -aq "$KERNEL_DIR/" /tmp/kbuild/

          cd /tmp/kbuild
          find . -type f -iname '*.patch' -print0 | xargs -n1 -0 -r patch -p1 -N -i || true

          # 5. Apply configs and build modules
          cp "$KERNEL_DIR/.config" .config
          scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/build-config/*.config
          make olddefconfig
          make modules_prepare
          
          # Build cdc-wdm and qmi_wwan
          make -j$(nproc) M=drivers/usb/class modules
          cat drivers/usb/class/Module.symvers >> Module.symvers
          make -j$(nproc) M=drivers/net/usb KBUILD_EXTRA_SYMBOLS=/tmp/kbuild/drivers/usb/class/Module.symvers modules

          # Copy output
          mkdir -p $GITHUB_WORKSPACE/out
          cp drivers/usb/class/cdc-wdm.ko $GITHUB_WORKSPACE/out/
          cp drivers/net/usb/qmi_wwan.ko $GITHUB_WORKSPACE/out/

      - name: Package and verify modules
        if: steps.gate.outputs.skip != 'true'
        id: package
        shell: bash
        env:
          UNRAID_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq kmod
          OUTPUT="$(OUT_DIR=out DIST_DIR=dist bash source/package-output.sh)"
          printf '%s\n' "$OUTPUT"
          KVER="$(printf '%s\n' "$OUTPUT" | sed -n 's/^KERNEL_VERSION=//p')"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          KVER: ${{ steps.package.outputs.kver }}
        run: |
          set -euo pipefail
          TAG="unraid-${VERSION}"
          BUNDLE="dist/hideck-qmi-${VERSION}.tar.gz"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$BUNDLE" "$BUNDLE.sha256" \
            --title "HiDeck QMI driver for Unraid ${VERSION}" \
            --notes "cdc_wdm + qmi_wwan for Unraid ${VERSION}, kernel ${KVER}. The plugin verifies SHA-256 and vermagic before loading."
